# PVC is stripped from the user Pod and attached on the VMI as virtio-blk.
# The agent mkfs (if empty) and mounts it at /data in the guest rootfs.
#
#   $K apply -f examples/sandbox-pod-pvc.yaml
#   $K exec isolated-pvc -- cat /data/ok
# Expect: pvc-ok
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: isolated-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: isolated-pvc
spec:
  runtimeClassName: marooned
  containers:
  - name: box
    image: quay.io/prometheus/busybox:latest
    imagePullPolicy: Never
    command: ["/bin/sh", "-c", "echo pvc-ok > /data/ok; exec httpd -f -p 8080 -h /data"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: isolated-data
