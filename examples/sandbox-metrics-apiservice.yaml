# Optional: kubectl top for sandbox Pods (guest RSS, not pause).
# Skip if metrics-server is already registered.
#   $K apply -f examples/sandbox-metrics-apiservice.yaml
#   $K top pod isolated-model
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  insecureSkipTLSVerify: true
  service:
    name: maroonedpods-server
    namespace: marooned-system
    port: 443
  version: v1beta1
  versionPriority: 100
