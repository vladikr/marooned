# User workload in the guest (not alpine sleep). After Running:
#   IP=$(./cluster-up/kubectl.sh get pod isolated-busybox1 -o jsonpath='{.metadata.annotations.maroonedpods\.io/guest-ip}')
#   ./cluster-up/kubectl.sh run --rm -i -n default verify-marooned --image=quay.io/prometheus/busybox:latest --restart=Never -- wget -qO- http://$IP:8080/
#   ./cluster-up/kubectl.sh run --rm -i -n default verify-svc --image=quay.io/prometheus/busybox:latest --restart=Never -- wget -qO- http://isolated-busybox1:8080/
# Expect: marooned-guest-ok
# kubelet HTTP probes are rewritten to exec wget 127.0.0.1 (pause podIP has no httpd).
apiVersion: v1
kind: Pod
metadata:
  name: isolated-busybox1
spec:
  runtimeClassName: marooned
  containers:
  - name: box
    image: quay.io/prometheus/busybox:latest
    imagePullPolicy: Never
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 2
      periodSeconds: 5
    command: ["/bin/sh", "-c", "echo marooned-guest-ok; echo marooned-guest-ok > /tmp/marooned-ok; echo marooned-guest-ok > /tmp/index.html; exec httpd -f -p 8080 -h /tmp"]
---
# selector-less Service; adaptor EndpointSlice kubernetes.io/service-name=isolated-busybox1
apiVersion: v1
kind: Service
metadata:
  name: isolated-busybox1
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
