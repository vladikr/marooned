# User workload in the guest (not alpine sleep). After Running:
#   IP=$(./cluster-up/kubectl.sh get pod isolated-busybox1 -o jsonpath='{.metadata.annotations.maroonedpods\.io/guest-ip}')
#   ./cluster-up/kubectl.sh run --rm -n default verify-marooned --image=quay.io/prometheus/busybox:latest --restart=Never -- wget -qO- http://$IP:8080/
# Expect: marooned-guest-ok
apiVersion: v1
kind: Pod
metadata:
  name: isolated-busybox1
spec:
  runtimeClassName: marooned
  containers:
  - name: box
    image: quay.io/prometheus/busybox:latest
    imagePullPolicy: Never
    command: ["/bin/sh", "-c", "echo marooned-guest-ok; echo marooned-guest-ok > /tmp/marooned-ok; echo marooned-guest-ok > /tmp/index.html; exec httpd -f -p 8080 -h /tmp"]
